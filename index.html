<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / Browser -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>
      Odikart Technology | Web Development, Apps, E-Commerce & AI Solutions
    </title>

    <meta
      name="description"
      content="Odikart Technology provides modern website development, mobile apps, e-commerce solutions, APIs, software development and AI-powered digital solutions for businesses."
    />

    <meta
      name="keywords"
      content="Odikart Technology, web development, website development, mobile app development, e-commerce development, AI solutions, API development, software development, React development, Node.js development, digital solutions, Bhubaneswar, Odisha"
    />

    <meta name="author" content="Odikart Technology" />
    <meta name="publisher" content="Odikart Technology" />

    <!-- Search Engine Crawling -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://technology.odikart.in/"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Odikart Technology | Web, Apps, E-Commerce & AI Solutions"
    />

    <meta
      property="og:description"
      content="Modern websites, mobile apps, e-commerce platforms, APIs and AI-powered digital solutions for modern businesses."
    />

    <meta
      property="og:url"
      content="https://technology.odikart.in/"
    />

    <meta
      property="og:site_name"
      content="Odikart Technology"
    />

    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:image"
      content="https://technology.odikart.in/logo.png"
    />

    <meta
      property="og:image:alt"
      content="Odikart Technology Logo"
    />

    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Odikart Technology | Web, Apps, E-Commerce & AI Solutions"
    />

    <meta
      name="twitter:description"
      content="Modern websites, mobile apps, e-commerce, APIs and AI-powered digital solutions for businesses."
    />

    <meta
      name="twitter:image"
      content="https://technology.odikart.in/logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="Odikart Technology Logo"
    />

    <!-- Business / Location -->
    <meta name="geo.region" content="IN-OR" />
    <meta
      name="geo.placename"
      content="Bhubaneswar, Odisha, India"
    />
    <meta name="language" content="English" />

    <!-- Performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://technology.odikart.in/#organization",
            "name": "Odikart Technology",
            "url": "https://technology.odikart.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://technology.odikart.in/logo.png"
            },
            "description": "Odikart Technology provides modern website development, mobile apps, e-commerce solutions, APIs, software development and AI-powered digital solutions.",
            "areaServed": {
              "@type": "Country",
              "name": "India"
            },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Bhubaneswar",
              "addressRegion": "Odisha",
              "addressCountry": "IN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://technology.odikart.in/#website",
            "url": "https://technology.odikart.in/",
            "name": "Odikart Technology",
            "publisher": {
              "@id": "https://technology.odikart.in/#organization"
            },
            "inLanguage": "en-IN"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
